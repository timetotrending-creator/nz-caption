<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NZ Caption</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.login-container { min-height: calc(100vh - 73px); display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
.login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
.login-card h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; text-align: center; }
.login-card .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
.google-btn { width: 100%; padding: 12px; background: white; color: #1a1a2e; border: 1px solid #dadce0; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; margin-bottom: 16px; }
.google-btn:hover { background: #f8f9fa; }
[data-theme="dark"] .google-btn { background: #2a2a35; color: white; border-color: #3a3a48; }
[data-theme="dark"] .google-btn:hover { background: #353540; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--text-light); font-size: 12px; margin: 20px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.trial-info { background: var(--accent-soft); color: var(--accent); padding: 12px; border-radius: var(--radius-sm); font-size: 13px; text-align: center; margin-bottom: 24px; }
.signup-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
.signup-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
.demo-note { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: var(--warning); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12px; text-align: center; margin-bottom: 16px; }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo"><div class="logo-icon">NZ</div><span>NZ Caption</span></a>
  <div class="nav-right">
    <button class="icon-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button>
  </div>
</nav>

<div class="login-container">
  <div class="login-card">
    <h1>Welcome to NZ Caption</h1>
    <p class="subtitle">Sign in to save templates and access premium features</p>
    <div class="trial-info"><strong>🎁 3-day free trial</strong> of all premium features</div>
    <div class="demo-note">⚠️ Demo mode: Real Google login needs server setup. Click below to simulate.</div>

    <button class="google-btn" onclick="demoLogin()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <label class="label" for="email">Email</label>
    <input type="email" id="email" class="input" placeholder="you@example.com" style="margin-bottom: 12px;">
    <label class="label" for="name">Your name</label>
    <input type="text" id="name" class="input" placeholder="Jane Creator" style="margin-bottom: 16px;">
    <button class="btn btn-accent" style="width: 100%; padding: 12px;" onclick="emailLogin()">Create free account</button>

    <div class="signup-link">Already have an account? <a href="dashboard.html">Continue to dashboard</a></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function demoLogin() {
  Auth.login('Demo User', 'demo@nzcaption.com');
  showToast('Signed in! Redirecting...');
  setTimeout(() => window.location.href = 'dashboard.html', 800);
}
function emailLogin() {
  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('name').value.trim();
  if (!email || !email.includes('@')) { showToast('Please enter a valid email'); return; }
  if (!name) { showToast('Please enter your name'); return; }
  Auth.login(name, email);
  showToast(`Welcome, ${name.split(' ')[0]}! Redirecting...`);
  setTimeout(() => window.location.href = 'dashboard.html', 800);
}
if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';
</script>

</body>
</html>
